name: Build WebAssembly

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.48

      - name: Verify emcc
        run: emcc --version

      - name: Download lz4 source
        run: |
          mkdir -p libs/lz4/lib libs/lz4/include
          curl -L https://raw.githubusercontent.com/lz4/lz4/dev/lib/lz4.c -o libs/lz4/lib/lz4.cpp
          curl -L https://raw.githubusercontent.com/lz4/lz4/dev/lib/lz4.h -o libs/lz4/include/lz4.h
          ls -la libs/lz4/lib/ libs/lz4/include/

      - name: Convert source files from GBK to UTF-8
        run: |
          for dir in Game common; do
            find "$dir" -type f \( -name "*.cpp" -o -name "*.h" \) | while read f; do
              if iconv -f GBK -t UTF-8 "$f" > "$f.tmp" 2>/dev/null; then
                mv "$f.tmp" "$f"
                echo "converted: $f"
              else
                rm -f "$f.tmp"
                echo "skip (not GBK?): $f"
              fi
            done
          done

      - name: Build WebAssembly
        working-directory: ./Game
        run: |
          emcc \
            main.cpp \
            GameState.cpp \
            GameRenderer.cpp \
            GameMenu.cpp \
            GameNetwork.cpp \
            ../common/Human.cpp \
            ../common/ParticleSystem.cpp \
            ../common/Settings.cpp \
            ../common/World.cpp \
            ../common/WorldClient.cpp \
            ../common/WorldGrid.cpp \
            ../common/WorldEntity.cpp \
            ../common/Zombie.cpp \
            ../common/TaskScheduler.cpp \
            ../common/Network.cpp \
            ../common/Tool/Random.cpp \
            ../common/Tool/Render.cpp \
            ../common/Tool/Cursor.cpp \
            ../common/Tool/Font.cpp \
            ../common/Tool/Image.cpp \
            ../common/Tool/Log.cpp \
            ../common/Tool/String.cpp \
            ../common/Tool/TextInput.cpp \
            ../common/Tool/Audio.cpp \
            ../common/Tool/Blur.cpp \
            ../common/Tool/Menu.cpp \
            ../libs/lz4/lib/lz4.cpp \
            -o purge.html \
            -I../libs/FastNoiseLite \
            -I../libs/nlohmann \
            -I../libs/lz4/include \
            -I../common \
            -I. \
            -sUSE_SDL=2 \
            -sUSE_SDL_MIXER=2 \
            -sUSE_SDL_TTF=2 \
            -sUSE_SDL_IMAGE=2 \
            -sSDL2_IMAGE_FORMATS='["png","jpg"]' \
            -sALLOW_MEMORY_GROWTH=1 \
            -sASYNCIFY=1 \
            -sSTACK_SIZE=8MB \
            -sINITIAL_MEMORY=64MB \
            -sMAXIMUM_MEMORY=512MB \
            -sFORCE_FILESYSTEM=1 \
            -O2 \
            -std=c++11 \
            -DWEB_BUILD \
            -D__EMSCRIPTEN__ \
            --preload-file ../assets@/assets \
            --preload-file ../data@/data \
            -sEXPORTED_RUNTIME_METHODS='["ccall","cwrap"]' \
            --shell-file web_shell.html

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: purge-web-build
          path: |
            Game/purge.html
            Game/purge.js
            Game/purge.wasm
            Game/purge.data
          retention-days: 30