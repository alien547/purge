name: Build WebAssembly

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.48

      - name: Verify emcc
        run: emcc --version

      - name: Build WebAssembly
        working-directory: ./Game
        run: |
          emcc \
            main.cpp \
            GameState.cpp \
            GameRenderer.cpp \
            GameMenu.cpp \
            ../common/Human.cpp \
            ../common/ParticleSystem.cpp \
            ../common/Settings.cpp \
            ../common/World.cpp \
            ../common/WorldClient.cpp \
            ../common/WorldGrid.cpp \
            ../common/WorldEntity.cpp \
            ../common/Zombie.cpp \
            ../common/TaskScheduler.cpp \
            ../common/Network.cpp \
            ../common/Tool/Random.cpp \
            ../common/Tool/Render.cpp \
            ../common/Tool/Cursor.cpp \
            ../common/Tool/Font.cpp \
            ../common/Tool/Image.cpp \
            ../common/Tool/Log.cpp \
            ../common/Tool/String.cpp \
            ../common/Tool/TextInput.cpp \
            ../common/Tool/Audio.cpp \
            ../common/Tool/Blur.cpp \
            ../common/Tool/Menu.cpp \
            -o purge.html \
            -I../libs/FastNoiseLite \
            -I../libs/nlohmann \
            -I../libs/lz4/include \
            -I../common \
            -I. \
            -sUSE_SDL=2 \
            -sUSE_SDL_MIXER=2 \
            -sUSE_SDL_TTF=2 \
            -sUSE_SDL_IMAGE=2 \
            -sSDL2_IMAGE_FORMATS='["png","jpg"]' \
            -sALLOW_MEMORY_GROWTH=1 \
            -sASYNCIFY=1 \
            -sSTACK_SIZE=8MB \
            -sINITIAL_MEMORY=64MB \
            -sMAXIMUM_MEMORY=512MB \
            -sFORCE_FILESYSTEM=1 \
            -O1 \
            -std=c++11 \
            -DWEB_BUILD \
            -D__EMSCRIPTEN__ \
            --preload-file ../assets@/assets \
            --preload-file ../data@/data \
            -sEXPORTED_RUNTIME_METHODS='["ccall","cwrap"]' \
            --shell-file web_shell.html

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: purge-web-build
          path: |
            Game/purge.html
            Game/purge.js
            Game/purge.wasm
            Game/purge.data
          retention-days: 30